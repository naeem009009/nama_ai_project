<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nama AI — Intelligent Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236366F1'/%3E%3Cpath d='M10 20 L16 10 L22 20Z' fill='white' opacity='0.9'/%3E%3C/svg%3E" />
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">N</div>
                    <h1>Nama AI</h1>
                </div>
                <button id="new-chat-btn" class="new-chat-btn" title="New Chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New Chat
                </button>
            </div>

            <nav id="history-list" class="history-list">
                <!-- Populated dynamically by chat.js -->
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar">{{ username[:2] | upper }}</div>
                    <span class="user-name">{{ username }}</span>
                </div>
                <button id="logout-btn" class="logout-btn" title="Sign out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </aside>

        <!-- Mobile menu toggle -->
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <!-- Main Area -->
        <main id="main-area">
            <!-- Chat Messages -->
            <div id="chat-container">
                <div id="messages">
                    <!-- Welcome message injected by JS -->
                </div>
            </div>

            <!-- Input Area -->
            <div id="input-area">
                <div class="input-wrapper">
                    <button id="attach-btn" class="icon-btn" title="Attach file" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <textarea id="message-input" rows="1" placeholder="Message Nama AI ..." autofocus></textarea>
                    <button id="send-btn" class="send-btn" title="Send message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
                <p class="disclaimer">Nama AI is a local assistant. Responses may vary.</p>
            </div>
        </main>
    </div>

    <script>
        const NAMA_API_KEY = "{{ api_key }}";
        const NAMA_USERNAME = "{{ username }}";
    </script>
    <script src="/static/js/chat.js?v=2"></script>
</body>
</html>
